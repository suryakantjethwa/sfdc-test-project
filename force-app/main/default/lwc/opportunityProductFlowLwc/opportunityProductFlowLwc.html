<template>
    <template if:false={isCalledPreviewFlow}>
    <template if:true={initialSelection}>
        <lightning-card>

            <div class="modal">
                <header class="modal-header">
                    <lightning-layout horizontal-align="spread">
                        <!-- Product Name Header -->
                        <lightning-layout-item size="4" class="slds-text-align_center">
                        </lightning-layout-item>

                        <!-- Quantity Header -->
                        <lightning-layout-item size="4" class="slds-text-align_center">
                            <h2 class="slds-text-heading_large">Calculate Sales</h2>
                        </lightning-layout-item>

                        <!-- Action Header -->
                        <lightning-layout-item size="4" class="slds-text-align_right">
                            <span class={statusClass}>&#8226; {status}</span>
                        </lightning-layout-item>
                    </lightning-layout>
                </header>

                <div class="modal-body">
                        <div class="slds-grid slds-grid_align-spread">
                            <h1>Opportunity Name: <b>{OpportunityName} - </b></h1>
                            <div class="slds-grid slds-grid_align-end slds-grid_vertical-align-center">
                                <h1>Opportunity Total: <b> ${FinalAmount}</b></h1>
                            </div>
                        </div>
                
                        <h1>Stage Name: <b> {StageName}</b></h1>
                        <hr>
                
                        <h1><b>Add Licenses</b></h1>
                        
                        <!-- Loop through all products (Free, Paid, Entry) -->
                        <template for:each={products} for:item="product">
            
            
                            <!-- If the product is Entry, It should be disabled -->
                            <template if:true={product.isEntry}>
                                <div key={product.Id} class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                    <div class="slds-grid slds-grid_align-start slds-grid_vertical-align-center">
                                        <!-- Product checkbox (disabled) -->
                                        <lightning-input class="slds-m-right_small" type="checkbox" checked="checked" disabled></lightning-input>
                                        
                                        <div class="slds-m-bottom_small">
                                            <span class="slds-text-title">{product.Name}</span>
                                        
                                        </div>
                                    </div>
                                    <h1>*Default Entry Fee: <b> ${product.ListPrice}</b></h1>
                                </div>
                            </template>
            
                
                            <!-- If the product is Free, show Free Quantity input -->
                            <template if:true={product.isFree}>
                                <div key={product.Id} class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                    <div class="slds-grid slds-grid_align-start slds-grid_vertical-align-center">
                                        <lightning-input class="slds-m-right_small" type="checkbox" checked onchange={handleFreeCheckboxChange} disabled></lightning-input>
                                        <lightning-input class="slds-m-right_small" label="Free License" value={product.Quantity} type="number" onchange={handleFreeLicenseCount} disabled></lightning-input>
                                    </div>
                                </div>
                            </template>
                
                            <!-- If the product is Paid, show Paid Quantity input and Total Amount -->
                            <template if:true={product.isPaid}>
                                <div key={product.Id} class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                    <div class="slds-grid slds-grid_align-start slds-grid_vertical-align-center">
                                        <lightning-input class="slds-m-right_small" type="checkbox" checked={product.isChecked} onchange={handlePaidChange}></lightning-input>
                                        <lightning-input class="slds-m-right_small" label="Paid License" type="number" value={product.Quantity} onchange={handlePaidLicenseCount} disabled={isPaidCheckboxSelected}></lightning-input>
                                        <lightning-input class="slds-m-right_small" label="Total Amount" type="number" formatter="currency" step="0.01" value={product.TotalAmount} disabled></lightning-input>
                                    </div>
                                    <h1>*Unit Price: <b> ${product.ListPrice}</b></h1>
                                </div>
                            </template>
                        </template>
                </div>
           </div>
        </lightning-card>

        <footer class="modal-footer">
            <div class="footer-buttons">
                <div class="left-buttons">
                    <lightning-button variant="neutral" label="Cancel" onclick={closeModal} class="slds-float_left"></lightning-button>
                   
                </div>
                <div class="right-buttons">
                    <lightning-button variant="brand" label="Configure Products"  onclick={handleConfigureProducts} class="slds-button__icon_left" disabled={disableConfigureCTA}  ></lightning-button>
                </div>
            </div>
        </footer>
       
    </template>

    <template if:false={initialSelection}>
        <lightning-card>

            <div class="modal">
                <header class="modal-header">
                    <lightning-layout horizontal-align="spread">
                        <!-- Product Name Header -->
                        <lightning-layout-item size="4" class="slds-text-align_center">
                        </lightning-layout-item>

                        <!-- Quantity Header -->
                        <lightning-layout-item size="4" class="slds-text-align_center">
                            <h2 class="slds-text-heading_large">Calculate Sales</h2>
                        </lightning-layout-item>

                        <!-- Action Header -->
                        <lightning-layout-item size="4" class="slds-text-align_right">
                            <span class={statusClass}>&#8226; {status}</span>
                        </lightning-layout-item>
                    </lightning-layout>
                </header>
                <div class="modal-body">
                    <div class="slds-grid slds-grid_align-spread">
                        <h1>Opportunity Name: <b>{OpportunityName} - </b></h1>
                    </div>
                    <h1>Stage Name: <b> {StageName}</b></h1>
                    <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-around_medium">
                        <div class="slds-grid slds-grid_align-start slds-grid_vertical-align-center slds-m-horizontal_medium">
                            <div class="slds-m-right_medium">
                                <lightning-combobox 
                                    label="Product Family"
                                    placeholder="Select a Value" 
                                    options={keyOptions} 
                                    value={selectedKey} 
                                    onchange={handleKeyChange}
                                    style="width: 200px; height: 50px;">
                                </lightning-combobox>
                            </div>
                            <div class="slds-m-right_medium">
                                <lightning-combobox 
                                    label="Product Campaign" 
                                    placeholder="Select a Value" 
                                    options={valueOptions} 
                                    value={selectedvalue} 
                                    onchange={handleValueChange}
                                    style="width: 200px; height: 50px;">
                                </lightning-combobox>
                            </div>
                    
                            <div style="margin-top: 20px;"> <!-- Added margin to adjust the button position -->
                                <lightning-button 
                                    variant="brand" 
                                    label="Search" 
                                    onclick={handleSearchData} 
                                    class="slds-align_absolute-center">
                                </lightning-button>
                            </div>
                        </div>
                        <div class="slds-grid slds-grid_align-end slds-grid_vertical-align-center">
                            <h1>Opportunity Total: <b> ${FinalAmount}</b></h1>
                        </div>
                    </div>        
                    
                    <hr>
                    
                    <!-- for loop -->
                    <template if:true={isFederation}>

                        <template for:each={fedProducts} for:item="product">
                            <div key={product.ProductId} class="slds-box slds-m-around_medium">
                                <!-- Checkbox to enable/disable inputs -->
                                           
                                <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-top_medium">
                                           
                                    <div class="slds-grid slds-grid_align-start slds-grid_vertical-align-center">

                                        <div style="margin-top: 10px;">
                                            <lightning-input
                                                type="checkbox"
                                                checked={product.checked}
                                                data-id={product.ProductId}
                                                onchange={handleCheckboxChangeFedProd}
                                                disabled={product.disabled}
                                                >
                                            </lightning-input>
                                        </div>
                                        <div class="slds-m-right_small">
                                            <lightning-combobox
                                                label={product.ProductName}
                                                data-id={product.ProductId}
                                                placeholder="Select Product"
                                                options={product.comboboxoptions}
                                                value={product.selectedValue}
                                                onchange={handleComboboxChange}
                                                disabled={product.disabled}
                                                style="width: 250px; height: 50px;">
                                            </lightning-combobox>
                                        </div>
                                        
                                        <lightning-input
                                                class="slds-m-right_small"
                                                label="Quantity"
                                                type="number"
                                                data-id={product.ProductId}
                                                value={product.Quantity}   
                                                onchange={handleQuantityChangeFed}
                                                onblur={handleQuantityChangeFedBlur}
                                                disabled={product.disabled}
                                                placeholder="0"
                                                style="width: 150px; height: 50px;">
                                        </lightning-input>
                                        <lightning-input
                                                class="slds-m-right_small"
                                                label="Unit Price"
                                                type="number"
                                                data-id={product.ProductId}
                                                value={product.SalesPrice}
                                                onchange={handleCustomUnitPrice}
                                                onblur={handleCustomUnitPriceBlur}
                                                disabled={product.disabled}
                                                placeholder="0"
                                                style="width: 150px; height: 50px;">
                                        </lightning-input>
                                        <div class="slds-m-right_small">
                                            <h1>List Price: <b>{product.ListPrice}</b></h1>
                                        </div>
                                        <div class="slds-m-right_small">
                                            <h1>Total Price: <b>{product.overridedListPrice}</b></h1>
                                        </div>
                                       
                                    </div>
                
                                    
                                </div>
                                   <template if:true={product.errorMessage}>
                                        <div class="slds-text-color_error slds-m-top_x-small" style="margin-left: 298px;">
                                            {product.errorMessage}
                                        </div>
                                    </template>
                            </div>
                        </template>
                        <br>
                    </template>
                    <!--for loop ends-->
                    

                <!-- Modal -->
                    <template if:true={showModal}>
                        <section class="slds-modal slds-fade-in-open">
                            <div class="slds-modal__container">
                                <header class="slds-modal__header">
                                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                                            title="Close"
                                            onclick={closeModal}>
                                        <lightning-icon icon-name="utility:close" alternative-text="Close"></lightning-icon>
                                    </button>
                                    <h2 class="slds-text-heading_medium">Confirmation</h2>
                                </header>
                                <div class="slds-modal__content slds-p-around_medium">
                                    Are you sure?
                                </div>
                                <footer class="slds-modal__footer">
                                    <lightning-button label="Yes" variant="brand" onclick={confirmAction}></lightning-button>
                                    <lightning-button label="No" variant="brand" onclick={closeModal}></lightning-button>
                                </footer>
                            </div>
                        </section>
                        <div class="slds-backdrop slds-backdrop_open"></div>
                    </template>


                    <template if:true={isOtherData}>
                    
                            <template if:true={products}>
                                <template for:each={products} for:item="product">
                                    <div key={product.Id} class="slds-m-bottom_small">
                                        <div class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center">
                                                    <div class="slds-grid slds-grid_align-start slds-grid_vertical-align-center">
                                        <lightning-input 
                                            type="checkbox" 
                                            data-index={index}
                                            onchange={handleCheckboxChange}
                                            checked={product.checked}
                                            data-id={product.ProductId}
                                            >
                                        </lightning-input>

                                        <lightning-input
                                            type="text"
                                            label={product.ProductName}
                                            value={product.Quantity}
                                            data-id={product.ProductId}
                                            onchange={handleQuantityChange}
                                            disabled={product.disabled}
                                            style="width: 250px; height: 50px;">
                                        </lightning-input>

                                          <lightning-input
                                                class="slds-m-left_small"
                                                label="Updated List Price"
                                                type="number"
                                                data-id={product.ProductId}
                                                value={product.TotalPrice}   
                                                onchange={handleCustomTotalPriceChange}
                                                disabled={product.disabled}
                                                placeholder="0"
                                                style="width: 150px; height: 50px;">
                                        </lightning-input>
                                        <div class="slds-m-right_small">
                                            <p class="slds-m-left_small"> {dollersigntext} <b> ${product.ListPrice}</b></p>
                                        </div>
                                        <div class="slds-m-right_small">
                                            <p class="slds-m-left_small"> Total Price: <b> ${product.overridedListPrice}</b></p>
                                        </div>

                                    </div>
                                        
                                      
                                    </div>
                                    </div>
                                </template>
                            </template>
                            <template if:false={products}>
                                <p>No products found.</p>
                            </template>
                        
                        
                    </template>

                </div>
            </div>

            <footer class="modal-footer">
                <div class="footer-buttons">
                    <div class="left-buttons">
                        <lightning-button variant="neutral" label="Cancel" onclick={closeModal} class="slds-m-right_small"></lightning-button>
                        <lightning-button variant="neutral" label="Back" onclick={goToInitialPage}></lightning-button>
                    </div>
                    <div class="right-buttons">
                        <lightning-button variant="brand" label="Save" onclick={handleSaveProducts} class="slds-m-right_small" disabled={disableSaveButton}></lightning-button>
                        <lightning-button variant="brand" label="Next" onclick={handleNextFederationAndOther} class="slds-float_right"></lightning-button>
                    </div>
                </div>
            </footer>
                
        </lightning-card>
    </template>
    </template>
    <template if:true={isCalledPreviewFlow}>
        <c-preview-opportunity-line-items ></c-preview-opportunity-line-items>
    </template>
</template>
