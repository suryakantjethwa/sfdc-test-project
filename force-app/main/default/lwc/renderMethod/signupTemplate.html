<template>
    <lightning-card  title="Sign up form" icon-name="custom:custom14" class="slds-m-around_medium">
        <div class="slds-var-m-around_medium">
            <h2 class="slds-text-heading_medium slds-var-m-bottom_medium"> Choose your option</h2>
            <lightning-input type="text" label="First Name" ></lightning-input>
            <lightning-input type="text" label="Last Name" ></lightning-input>
            <lightning-input type="email" label="Email" ></lightning-input>
            <lightning-input type="password" label="Password" ></lightning-input>

            <lightning-button 
            variant="destructive"
            label="back"
            title="back"
            onclick={handleClick}
            class="slds-m-left_x-small"></lightning-button>

            <lightning-button 
            variant="success"
            label="signup"
            title="signup"
            onclick={submitHandler}
            class="slds-m-left_x-small"></lightning-button>

            
        </div>
    </lightning-card>
</template>
