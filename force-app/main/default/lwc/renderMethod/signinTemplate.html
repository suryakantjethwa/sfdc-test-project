<template>

    <lightning-card  title="Sign in form" icon-name="custom:custom14" class="slds-m-around_medium">
        <div class="slds-var-m-around_medium">
            <h2 class="slds-text-heading_medium slds-var-m-bottom_medium"> Sign in</h2>
          
            <lightning-input type="email" label="Email" ></lightning-input>
            <lightning-input type="password" label="Password" ></lightning-input>

            <lightning-button 
            variant="destructive"
            label="back"
            title="back"
            onclick={handleClick}
            class="slds-m-left_x-small"></lightning-button>

            <lightning-button 
            variant="success"
            label="signin"
            title="signin"
            onclick={submitHandler}
            class="slds-m-left_x-small"></lightning-button>
            
        </div>
    </lightning-card>
</template>
