<template>

    <lightning-card title="User demo comp">
        <div class="slds-p-around_medium">
          <template if:true={users}>
            <template for:each={users} for:item="user">
                <div class="slds-box slds-box_xx-small" key={user.Id}>
                    <article class="slds-card">
                        <div class="slds-card__header slds-grid">
                            <header class="slds-media slds-media_center slds-has-flexi-truncate">
                                <div class="slds-media__figure">
                                    <img src={user.ProfileImage} alt="Profile Pic" class="slds-avatar slds-avatar_circle slds-avatar_large" />
                                </div>
                                <div class="slds-media__body">
                                    <h2>
                                        <a href="#" class="slds-card__header-link slds-truncate" title={user.Name}>
                                            <span>{user.FirstName} {user.LastName}</span>
                                        </a>
                                    </h2>
                                </div>
                            </header>
                        </div>
                        <div class="slds-card__body slds-card__body_inner">
                            <p><strong>Revenue: </strong>${user.Revenue}</p>
                        </div>
                    </article>
                </div>
            </template>
           
          </template>
        </div>
    </lightning-card>
    
</template>
